# Revisión nativa: el modelo solo produce datos; el helper confiable publica el review.
name: opencode-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      review_needed: ${{ steps.prepare.outputs.skip != 'true' }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted review helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout PR source (never execute its scripts)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare bounded diff
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu
          checkpoint="$(python3 .github/scripts/review_helper.py checkpoint --token "$GH_TOKEN" --repo "$REPO" --number "$PR_NUMBER")"
          last_sha="$(printf '%s' "$checkpoint" | jq -r '.head_sha // empty')"
          previous_base="$(printf '%s' "$checkpoint" | jq -r '.base_sha // empty')"
          if [ "$last_sha" = "${{ github.event.pull_request.head.sha }}" ] && [ "$previous_base" = "${{ github.event.pull_request.base.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_number="$(python3 -c 'import os,re; s=os.environ.get("PR_TITLE","")+" "+os.environ.get("PR_BRANCH",""); m=re.search(r"\(#([0-9]+)\)",s); print(m.group(1) if m else "")')"
          issue_args=()
          if [ -n "$issue_number" ]; then
            python3 .github/scripts/review_helper.py issue-context --token "$GH_TOKEN" --repo "$REPO" --number "$issue_number" > issue-context.json
            issue_args=(--issue-context issue-context.json)
          fi
          python3 .github/scripts/review_helper.py prepare \
            --repo source --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --last-sha "$last_sha" --previous-base "$previous_base" \
            --prompt .github/scripts/review_prompt.md --output review-input.json --scope review-scope.json "${issue_args[@]}"
      - name: Install OpenCode CLI
        if: steps.prepare.outputs.skip != 'true'
        run: curl -fsSL https://opencode.ai/install | bash
      - name: Ask model for strict findings only
        if: steps.prepare.outputs.skip != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"*":"deny"}'
          OPENCODE_DISABLE_DEFAULT_PLUGINS: '1'
        run: |
          set -eu
          export PATH="$HOME/.opencode/bin:$PATH"
          scratch="$(mktemp -d)"
          cp model_prompt.md "$scratch/prompt.md"
          cd "$scratch"
          opencode run --model opencode-go/glm-5.3 --format json "$(cat prompt.md)" > "$GITHUB_WORKSPACE/model-events.json"
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/review_helper.py extract --input model-events.json --output findings.json
      - name: Upload validated model result
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-findings
          path: |
            findings.json
            review-scope.json
          if-no-files-found: error

  publish:
    needs: analyze
    if: needs.analyze.result == 'success' && needs.analyze.outputs.review_needed != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted publisher helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: opencode-findings
      - name: Publish current-head native review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 .github/scripts/review_helper.py publish \
            --findings findings.json --token "$GH_TOKEN" --repo "${{ github.repository }}" \
            --scope review-scope.json \
            --number "${{ github.event.pull_request.number }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --base "${{ github.event.pull_request.base.sha }}"
