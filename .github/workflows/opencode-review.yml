# Revisión automática de PRs con OpenCode.
name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout trusted checkpoint control
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-control
          persist-credentials: false
          fetch-depth: 1

      - name: Move trusted checkpoint control outside workspace
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          runner_temp="${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$runner_temp"
          trusted_control="$runner_temp/opencode-review-control"
          if [ -f .review-control/.github/scripts/review_checkpoint.py ]; then
            mkdir -p "$trusted_control/.github/scripts"
            cp .review-control/.github/scripts/review_checkpoint.py \
              "$trusted_control/.github/scripts/review_checkpoint.py"
            chmod 500 "$trusted_control/.github/scripts/review_checkpoint.py"
          fi
          mv .review-control "$runner_temp/trusted-review-checkout"

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check successful review checkpoint
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -eu
          runner_temp="${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$runner_temp"
          comments_file="$runner_temp/opencode-review-comments.json"
          gh api --paginate --slurp "repos/$REPO/issues/$PR_NUMBER/comments" > "$comments_file"
          control_script="$runner_temp/opencode-review-control/.github/scripts/review_checkpoint.py"
          if [ -f "$control_script" ]; then
            last_sha="$(python3 "$control_script" candidate "$BASE_SHA" < "$comments_file")"
          else
            # The base predates the trusted control script; never run PR code.
            last_sha=""
          fi
          compare='{}'
          if [ -n "$last_sha" ]; then
            set +e
            compare="$(gh api "repos/$REPO/compare/$last_sha...$HEAD_SHA" 2>/dev/null)"
            compare_status=$?
            set -e
            if [ "$compare_status" -ne 0 ]; then
              compare='{}'
            fi
          fi
          if [ -f "$control_script" ]; then
            result="$(python3 "$control_script" "$HEAD_SHA" "$BASE_SHA" "$compare" < "$comments_file")"
          else
            result='{"mode":"full","last_successful_sha":""}'
          fi
          mode="$(printf '%s' "$result" | jq -r .mode)"
          checkpoint="$(printf '%s' "$result" | jq -r .last_successful_sha)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "last_sha=$checkpoint" >> "$GITHUB_OUTPUT"
          if [ "$mode" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OpenCode review
        if: steps.prepare.outputs.skip != 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3
          use_github_token: true
          prompt: |
            Revisa este pull request y responde en español.
            Este es el último SHA de una revisión exitosa para esta misma base:
            ${{ steps.prepare.outputs.last_sha || 'ninguno; revisa el PR completo' }}.
            Si existe, úsalo como referencia para concentrarte en los cambios desde
            ese SHA. Esta indicación es orientativa: no asumas que el contexto cargado
            por la acción fue recortado y revisa el contexto disponible. Si no hay
            ascendencia válida (por ejemplo, un force-push), revisa el PR completo.
            - Contrasta contra docs/flujo_matricula_casa_amarilla_2027_ia.md: estados Solicitud/Matrícula/Pago, invitación 48 h, documentos 7 días calendario, pago 72 h, vacantes (capacidad menos PENDIENTE_PAGO/ACTIVA) y unicidad activa por Alumno. No inventes reglas de “Pendiente de definición”.
            - Identifica el issue del título/rama `type(#NN)` y verifica sus comentarios si el contexto lo permite. Lee CONTEXT.md: usa Alumno, Apoderado, Apoderado principal/adicional y Personal; señala términos evitables como estudiante, padre, tutor o usuario.
            - Busca únicamente bugs reales: nulls, límites, duplicados, transiciones inválidas y edad al 31/03/2027. Mantén excepciones en src/modelo, negocio en src/negocio y sin dominio en src/ui. No exijas JUnit: el proyecto no tiene framework de tests.
            - No revises `src/PruebaPagos.java`; su exclusión es temporal y exacta.
            - Si cambia src/ui, contrasta con el Figma indicado solo si FIGMA_TOKEN permite verificarlo; si no, indica honestamente “fidelidad de diseño no verificable en CI: requiere revisión manual contra el Figma”.
            - Un blocker rompe una regla funcional o requerimiento y exige cambios. Un nonblocker es una observación real no bloqueante. No hagas nitpicking.
            - Cada id debe ser estable entre revisiones (basado en el problema/concepto, no en una línea que pueda desplazarse). Cada hallazgo inline debe usar la ruta y línea RIGHT del diff completo. Los bloqueadores sin línea válida se conservarán en el resumen.
            - Devuelve solamente el resultado de revisión solicitado por la acción.

      - name: Verify current head before checkpoint
        if: success() && steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          current="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.sha, .base.sha] | @tsv')"
          expected="$HEAD_SHA$(printf '\t')$BASE_SHA"
          [ "$current" = "$expected" ]

      - name: Record successful review checkpoint
        if: success() && steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
            -f body="<!-- opencode-review-checkpoint:v1 workflow=opencode-review head_sha=$HEAD_SHA base_sha=$BASE_SHA -->"
