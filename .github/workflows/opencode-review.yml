# Review automático de PRs con opencode (docs: opencode.ai/docs/github).
# Auth: OPENCODE_API_KEY (OpenCode Zen) + GITHUB_TOKEN — no requiere instalar la GitHub App.
# Modelo: gpt-6.1-sol (OpenAI) vía OpenCode — el cobro pasa por los créditos de OpenCode.
name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Evita reviews duplicadas cuando se pushean varios commits seguidos al mismo PR.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      # use_github_token: true → no necesita id-token: write (sin OIDC).
      contents: read
      pull-requests: write # para publicar el review en el PR
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/gpt-6.1-sol
          use_github_token: true
          prompt: |
            Review este pull request y responde en español.
            - Spec de contraste: docs/flujo_matricula_casa_amarilla_2027_ia.md es la
              especificación funcional. Verifica cada comportamiento cambiado contra sus
              reglas: estados (Solicitud, Matrícula, Pago), invitación de 48 h,
              7 días calendario de documentos, 72 h de pago de matrícula, vacantes
              calculadas (capacidad - matrículas PENDIENTE_PAGO/ACTIVA), unicidad de
              solicitud activa y de matrícula por alumno. Si el PR implementa algo de la
              sección "Pendiente de definición" del spec sin señalarlo, pide cambios:
              esos puntos no autorizan a inventar reglas.
            - Issue vinculado: identifica el número de issue del PR (convención de
              título/rama "type(#NN)") y léelo con sus comentarios
              (`gh issue view NN --comments`, gh ya viene en el runner y GITHUB_TOKEN
              está en el entorno). Verifica que el PR cumple los pedidos específicos
              de los comentarios; si algo quedó sin atender, señálalo.
            - Lee primero CONTEXT.md (glosario del dominio): señala cualquier nombre,
              mensaje o comentario que use los términos a evitar (ej. "estudiante",
              "padre/tutor", "usuario") en vez de los correctos (Alumno, Apoderado,
              Apoderado principal, Personal).
            - Busca bugs reales: nulls, límites de arreglos, duplicados no validados,
              transiciones de estado inválidas (EstadoSolicitud, EstadoMatricula,
              EstadoDocumento) y cálculos de edad/fechas (FechasAdmision, corte 31/03/2027).
            - Verifica consistencia con los patrones existentes: excepciones de dominio
              en src/modelo, lógica de negocio en src/negocio, sin lógica de dominio en src/ui.
            - Diseños: si el PR toca src/ui/, el diseño de referencia es el Figma
              https://www.figma.com/design/IkwxtdIlJIiat4jhOURfiC/Nido-La-Casa-Amarilla-2027-gpt6-sol
              (también como .fig binario en docs/, ilegible para ti). Con FIGMA_TOKEN
              del entorno, usa la REST API de Figma (api.figma.com, file key
              IkwxtdIlJIiat4jhOURfiC) para leer el diseño y contrastar componentes,
              textos, medidas y colores con los cambios. Si el token no existe o el
              acceso falla, marca "fidelidad de diseño no verificable en CI: requiere
              revisión manual contra el Figma". No inventes veredictos de diseño.
            - Ten en cuenta que el proyecto NO tiene framework de tests: no exijas JUnit,
              pero sí señala lógica difícil de verificar.
            - Solo señala problemas reales — nada de estilo trivial o nitpicking.
            - Si el PR rompe una regla del spec o un requerimiento, pide cambios;
              no apruebes con dudas.
